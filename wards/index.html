<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eluru Ward Voter Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f23; --muted:#646a73; --line:#dcd9d1; --soft:#efede7;
  --accent:#0b6e4f; --accent-ink:#ffffff; --hl:#ffe58a; --chip:#e9f3ef; --f:#9b2c5a; --m:#1f5fa8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1e23; --ink:#e8e9eb; --muted:#9aa1ab; --line:#30353d; --soft:#22262c;
    --accent:#3fbf8f; --accent-ink:#0c1512; --hl:#6b5a12; --chip:#1d2f28; --f:#e58bb0; --m:#7fb2ee;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --ink:#e8e9eb; --muted:#9aa1ab; --line:#30353d; --soft:#22262c;
  --accent:#3fbf8f; --accent-ink:#0c1512; --hl:#6b5a12; --chip:#1d2f28; --f:#e58bb0; --m:#7fb2ee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Noto Sans Telugu",system-ui,sans-serif}
.te{font-family:"Noto Sans Telugu",Inter,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px;font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{border:0;background:none;color:var(--muted);padding:9px 12px;font:inherit;font-weight:500;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
main{padding:14px 16px 60px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.searchrow{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:9px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.filters input[type=number]{width:58px;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.filters select{font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.status b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:3px 6px 3px 10px;color:var(--ink)}
.pill button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
/* grid of voter boxes, mirroring the printed roll */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 9px 8px;display:grid;grid-template-columns:1fr 84px;gap:0 8px;font-size:13px}
.card .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:4px;margin-bottom:4px;font-size:12px;color:var(--muted)}
.sno{display:inline-block;border:1px solid var(--ink);color:var(--ink);font-weight:600;padding:0 6px;margin-left:4px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:baseline}
.card dt{color:var(--muted);font-size:12px;white-space:nowrap}
.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.card .nm{font-weight:600}
.en{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.photo{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);height:74px;flex-direction:column;gap:2px}
.pcol{display:flex;flex-direction:column;gap:5px;align-self:center}
.acts{display:flex;gap:4px;justify-content:center}
.acts .slipbtn{margin:0;padding:2px 5px;font-size:12px;white-space:nowrap}
.card .top{flex-wrap:nowrap;gap:6px;white-space:nowrap}
.card .top>span{overflow:hidden;text-overflow:ellipsis}
.card.other{background:var(--chip)}
.xw{display:block;font-size:11px;color:var(--accent);font-weight:600;margin-top:1px}
.g{font-weight:600}.g.F{color:var(--f)}.g.M{color:var(--m)}
a.lk{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
a.lk:hover{color:var(--accent)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.epic{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
/* table view */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--soft);font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right}
.more{display:block;margin:16px auto;}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
/* summary */
.sum h2{font-size:16px;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv strong{font-size:18px;font-weight:600}
tfoot td{font-weight:600;background:var(--soft)}
.note{color:var(--muted);font-size:12.5px;margin-top:10px}
.hidden{display:none!important}
@media (max-width:620px){.controls{position:static}}

.wardbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.wardbar label{font-size:13px;color:var(--muted)}
#ward{font:inherit;font-size:15px;font-weight:600;padding:8px 12px;border:1px solid var(--accent);border-radius:9px;background:var(--panel);color:var(--ink);min-width:220px}
.wbadge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:11px;border-radius:5px;padding:0 5px;margin-right:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-size:20px}
.tile span{display:block;color:var(--muted);font-size:12px}
.tile.all{background:var(--chip)}
.ok{color:var(--accent);font-size:12px}
.warn{color:#b45309;font-size:12px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;max-width:320px;margin:10px auto}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.share{font-size:12.5px;color:var(--muted)}
.share code{background:var(--soft);padding:2px 6px;border-radius:5px;color:var(--ink)}
.slipbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit;font-size:11.5px;padding:1px 7px;cursor:pointer;margin-left:6px}
.slipbtn:hover{border-color:var(--accent);color:var(--accent)}
.prtrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#printArea{display:none}
.slips{display:grid;grid-template-columns:1fr 1fr;gap:0}
.slip{break-inside:avoid;page-break-inside:avoid;border:1px dashed #555;padding:3mm 3.5mm;min-height:62mm;box-sizing:border-box;
font:10pt/1.3 "Noto Sans Telugu",Inter,sans-serif;display:grid;grid-template-columns:1fr 21mm;grid-template-rows:auto auto 1fr auto;gap:0 2.5mm;color:#000}
.slip .sh{grid-column:1/-1;text-align:center;font-weight:600;font-size:10pt;border-bottom:1px solid #000;padding-bottom:1.2mm;margin-bottom:1.5mm}
.slip .sh small{display:block;font-weight:400;font-size:8pt}
.slip .sid{grid-column:1/-1;display:flex;justify-content:space-between;font-size:9.5pt;margin-bottom:1mm}
.slip .sid b{border:1px solid #000;padding:0 2mm;font-size:11pt}
.slip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.6mm 2.5mm;align-content:start}
.slip dt{font-size:8.5pt;color:#333;white-space:nowrap}
.slip dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.slip dd .en{display:block;font-weight:400;font-size:8.5pt;color:#333}
.slip .ph{border:1px solid #000;height:26mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8pt;color:#444;align-self:start;margin-top:1mm}
.slip .ft{grid-column:1/-1;font-size:7.5pt;color:#444;border-top:1px dotted #777;margin-top:1mm;padding-top:.8mm;display:flex;justify-content:space-between;align-self:end}
#snap{position:fixed;left:-10000px;top:0;width:105mm;background:#fff}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000}
  #printArea.one .slips{display:block}
  #printArea.one .slip{width:105mm;min-height:70mm;border:1px dashed #555}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <h1><span class="te">ఏలూరు నగర పాలక సంస్థ</span> · Ward photo voter lists 2026</h1>
  <div class="sub" id="sub">Eluru Municipal Corporation · searchable voter rolls by ward</div>
  <div class="wardbar">
   <label for="ward">Ward</label>
   <select id="ward"><option value="">Choose a ward…</option></select>
   <span class="share" id="share"></span>
  </div>
  <div class="tabs" role="tablist">
   <button class="tab" role="tab" aria-selected="true" data-tab="voters">Voters</button>
   <button class="tab" role="tab" aria-selected="false" data-tab="summary">Ward summary</button>
   <a class="tab" href="families.html" style="text-decoration:none">Split families ↗</a>
   <button class="tab" id="theme" style="margin-left:auto" title="Toggle light/dark">Theme</button>
  </div>
 </div>
</header>
<main class="wrap">

<section id="home">
 <h2 style="font-size:16px;margin:6px 0 4px">Choose a ward</h2>
 <p class="share" style="margin:0 0 10px">Each ward has its own link. Only the ward you open is downloaded.</p>
 <div class="tiles" id="tiles"></div>
</section>

<section id="voters" class="hidden">
 <div class="controls">
  <div class="searchrow">
   <input id="q" type="search" autocomplete="off" placeholder="Search anything: name, relative, house no, voter ID, serial… (Telugu or English)">
   <button class="btn" id="clear">Clear</button>
  </div>
  <div class="filters">
   <span>Part <span class="seg" id="fPart"></span></span>
   <span>Gender <span class="seg" id="fGen"><button class="on" data-v="">All</button><button data-v="M">M</button><button data-v="F">F</button><button data-v="O">O</button></span></span>
   <span>Age <input type="number" id="aMin" min="18" max="120" placeholder="min"> – <input type="number" id="aMax" min="18" max="120" placeholder="max"></span>
   <span>Search in <select id="fField">
     <option value="all">All fields</option><option value="name">Voter name</option><option value="rel">Relative name</option>
     <option value="house">House no</option><option value="epic">Voter ID</option><option value="sno">Serial no</option></select></span>
   <span>Sort <select id="sort"><option value="sno">Serial no</option><option value="name">Name (A–Z)</option><option value="house">House no</option><option value="ageA">Age ↑</option><option value="ageD">Age ↓</option></select></span>
   <label style="white-space:nowrap"><input type="checkbox" id="fz" checked> Similar spellings</label>
   <span class="seg" id="view"><button class="on" data-v="grid">Boxes</button><button data-v="table">Table</button></span>
  </div>
 </div>
 <div class="status"><span id="count"></span><span class="prtrow"><button class="btn" id="prtAll" title="Print a voter slip for every voter currently shown">🖨 Print slips</button><button class="btn" id="csv">Download results (CSV)</button></span></div>
 <div id="out"></div>
 <button class="btn primary more hidden" id="more">Show more</button>
</section>

<section id="summary" class="sum hidden"></section>
</main>

<div id="printArea"></div><div id="snap"></div>
<script>
const REL_TE = {Father:'తండ్రి పేరు',Husband:'భర్త పేరు',Mother:'తల్లి పేరు',Other:'ఇతరులు పేరు','—':'పేరు'};
const GEN_TE = {M:'పు',F:'స్త్రీ',O:'ఇ'};
const PAGE = 90;
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-IN');
const partsTxt = s => (String(s||'').match(/\d+/g)||[]).join(', ');

// ---------- search normalisation ("srinivasa rao" == "Srinivasarao" == "శ్రీనివాస") ----------
function foldEn(s){
  return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g,'')
    .replace(/w/g,'v').replace(/z/g,'j').replace(/aa/g,'a').replace(/ee/g,'i').replace(/oo/g,'u')
    .replace(/([kgcjtdpb])h/g,'$1').replace(/sh/g,'s').replace(/ayi/g,'ai').replace(/ravu/g,'rao')
    .replace(/(.)\1+/g,'$1');
}
function foldTe(s){ return String(s).normalize('NFC').replace(/[\s.:,\-\/\u200b-\u200d]/g,'').toLowerCase(); }
// fuzzy "skeleton": consonants only, so spelling variants meet (Nersu = Nerusu = n-r-s; నెరుసు = నేర్సు = నరస)
function skTe(s){ return foldTe(s).replace(/[\u0C3E-\u0C4D\u0C55\u0C56\u0C62\u0C63\u0C01-\u0C03]/g,''); }
function skEn(s){ const f=foldEn(s); return f ? f[0]+f.slice(1).replace(/[aeiouy]/g,'').replace(/(.)\1+/g,'$1') : ''; }
function skW(s,te){ return '|'+String(s||'').split(/[\s.]+/).filter(Boolean).map(w=>te?skTe(w):skEn(w)).filter(Boolean).join('|')+'|'; }

// ---------- data loading (one JSON per ward, cached) ----------
let INDEX = null;
const CACHE = new Map();
async function getIndex(){ if(!INDEX) INDEX = await fetch('data/wards/index.json',{cache:'no-cache'}).then(r=>r.json()); return INDEX; }
const wardVer = w => { const x = INDEX && INDEX.wards.find(v=>String(v.ward)===String(w)); return x ? `${x.total}-${x.bytes}` : Date.now(); };
async function getWard(w){
  if(CACHE.has(w)) return CACHE.get(w);
  const p = fetch(`data/wards/${w}.json?v=${wardVer(w)}`).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(doc=>{
    const c = doc.cols;
    const rows = doc.rows.map(r=>{ const d={}; c.forEach((k,i)=>d[k]=r[i]); d.ward=doc.meta.ward; d.asm=doc.meta.assembly_no; prep(d); return d; });
    return {meta:doc.meta, rows};
  });
  CACHE.set(w,p); p.catch(()=>CACHE.delete(w));
  return p;
}
const LINKS = new Map();
function getLinks(w){
  if(LINKS.has(w)) return LINKS.get(w);
  const p = fetch(`data/wards/${w}.links.json?v=${wardVer(w)}`).then(r=>r.ok?r.json():{}).catch(()=>({}));
  LINKS.set(w,p); return p;
}
const LCOLS = ['ward','sno','part','part_sno','name','name_en','rel_type','rel_name','rel_en','age','gender','house','epic','page','asm'];
let XTRA = [];   // other-ward voters shown with a house
function prep(d){
  d._f = { name: foldTe(d.name)+'|'+foldEn(d.name_en), rel: foldTe(d.rel_name)+'|'+foldEn(d.rel_en),
           house: foldTe(d.house), epic: String(d.epic).toLowerCase(), sno: ' '+d.sno+' '+d.part+'-'+d.part_sno+' ' };
  d._f.all = [d._f.name,d._f.rel,d._f.house,d._f.epic,d._f.sno,String(d.age)].join('|');
  d._s = { name: skW(d.name,1)+skW(d.name_en), rel: skW(d.rel_name,1)+skW(d.rel_en) };
  d._hs = doorSegs(d.house);
  d._s.all = d._s.name+'|'+d._s.rel;
}

// ---------- state ----------
const st = {ward:'', q:'', part:'', gen:'', aMin:null, aMax:null, field:'all', sort:'sno', view:'grid', shown:PAGE, exactHouse:null};
try{ const v=localStorage.getItem('eluruView'); if(v) st.view=v; }catch(e){}
let DATA = [], META = null, results = [];

function readURL(){
  const u = new URL(location.href);
  st.ward = (u.searchParams.get('ward') || location.hash.replace(/^#\/?(ward[=\/]?)?/,'') || '').trim().toLowerCase();
  st.q = u.searchParams.get('q') || '';
  $('q').value = st.q;
}
function writeURL(push){
  const u = new URL(location.href);
  u.hash = '';
  if(st.ward) u.searchParams.set('ward', st.ward); else u.searchParams.delete('ward');
  if(st.q) u.searchParams.set('q', st.q); else u.searchParams.delete('q');
  (push?history.pushState:history.replaceState).call(history, null, '', u);
  $('share').innerHTML = st.ward ? `Link: <code>${esc(u.origin+u.pathname)}?ward=${esc(st.ward)}</code>` : '';
}

async function openWard(w, push=true){
  st.ward = w; st.part=''; st.exactHouse=null; st.linked=null; XTRA=[]; writeURL(push);
  $('ward').value = w;
  if(!w){ show('home'); $('sub').textContent='Eluru Municipal Corporation · searchable voter rolls by ward'; return; }
  show('voters');
  $('out').innerHTML = `<div class="loading">Loading ward ${esc(w)}…<div class="bar"><i id="pbar"></i></div></div>`;
  $('count').textContent=''; $('more').classList.add('hidden');
  try{
    if(w==='all'){
      const idx = await getIndex(); let done=0;
      const docs = await Promise.all(idx.wards.map(x=>getWard(x.ward).then(d=>{ done++; const b=$('pbar'); if(b) b.style.width=(100*done/idx.wards.length)+'%'; return d; })));
      if(st.ward!=='all') return;
      DATA = docs.flatMap(d=>d.rows); META = null;
      $('sub').textContent = `All ${idx.wards.length} wards · ${fmt(DATA.length)} voters`;
    } else {
      const doc = await getWard(w);
      if(st.ward!==w) return;            // user switched again while loading
      DATA = doc.rows; META = doc.meta;
      const m = META;
      $('sub').textContent = `Ward ${m.ward} · Assembly ${m.assembly||m.assembly_no} · Parts ${partsTxt(m.parts)} · Published ${m.published} · Ages as of ${m.age_as_of} · ${fmt(m.counts.total)} voters`;
    }
    buildParts(); renderSummary(); run();
  }catch(e){
    $('out').innerHTML = `<div class="empty">Couldn't load ward ${esc(w)} (${esc(e.message)}). Check the ward number, or pick one from the list.</div>`;
  }
}
function show(which){
  $('home').classList.toggle('hidden', which!=='home');
  const tab = document.querySelector('.tab[aria-selected="true"]').dataset.tab;
  $('voters').classList.toggle('hidden', which==='home' || tab!=='voters');
  $('summary').classList.toggle('hidden', which==='home' || tab!=='summary');
}
function buildParts(){
  const parts = [...new Set(DATA.map(d=>d.part))].sort((a,b)=>a-b);
  $('fPart').innerHTML = `<button class="on" data-v="">All</button>` + (parts.length<=12 ? parts.map(p=>`<button data-v="${p}">${p}</button>`).join('') : '');
  seg('fPart','part');
}

// ---------- search ----------
// door numbers compare by whole parts: "7-20/1" -> " 7 20 1 ", "16A-8-3" -> " 16 a 8 3 "
function doorSegs(h){ return ' '+String(h||'').toLowerCase().replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2').split(/[^a-z0-9]+/).filter(Boolean).join(' ')+' '; }
function tokens(q){
  let parts=q.trim().split(/\s+/).filter(Boolean);
  // "7 20 1" / "16A 8 3": several short number-ish pieces -> one door number
  if(parts.length>=2 && parts.every(p=>/^[0-9]{1,4}[a-z]?$|^[a-z][0-9]{0,3}$/i.test(p)) && parts.filter(p=>/\d/.test(p)).length>=2) parts=[parts.join('-')];
  return parts.map(t=>{
    const te=/[ఀ-౿]/.test(t);
    let type='text';
    if(!te && /^\d+$/.test(t)) type='num';                                   // serial number
    else if(!te && /\d/.test(t) && /[-\/]/.test(t)) type='door';              // 16A-8-3, 7-20/1
    else if(!te && /^[a-z]{2,4}\d{5,}$/i.test(t)) type='epic';               // voter ID
    else if(!te && /\d/.test(t)) type='door';                                 // 16a, 574a …
    return {te, raw:t, type, num: type==='num'?t:null, seg: doorSegs(t),
            f: te?foldTe(t):(type==='text'?foldEn(t):t.toLowerCase().replace(/[^a-z0-9]/g,'')),
            s: type==='text'?(te?skTe(t):skEn(t)):''};
  }).filter(t=>t.f);
}
function matches(d,toks){
  let score=0;
  for(const t of toks){
    let ok=false, sc=0;
    const F=st.field;
    if(t.type==='num'){
      if((F==='all'||F==='sno') && String(d.sno)===t.num){ ok=true; sc=5; }
      else if((F==='all'||F==='sno') && String(d.part_sno)===t.num){ ok=true; sc=2; }
      else if((F==='all'||F==='house') && d._hs.includes(' '+t.num+' ')){ ok=true; sc=d._hs.trim()===t.num?4:1; }
    } else if(t.type==='door'){
      if(F==='all'||F==='house'){ const q=t.seg.trim(); if(q && d._hs.includes(' '+q+' ')){ ok=true; sc=d._hs.trim()===q?6:(d._hs.startsWith(' '+q+' ')?4:2); } }
      if(!ok && (F==='all'||F==='epic') && d._f.epic.includes(t.f)){ ok=true; sc=1; }
    } else if(t.type==='epic'){
      if((F==='all'||F==='epic') && d._f.epic.includes(t.f)){ ok=true; sc=8; }
    } else {
      const hay=d._f[F];
      if(hay && (hay.includes(t.f) || (!t.te && hay.includes(t.raw.toLowerCase())))){ ok=true; sc=(d._f.name.includes(t.f)?3:2); }
      else if(FUZZ && t.s.length>=3 && d._s[F] && d._s[F].includes('|'+t.s+'|')){ ok=true; sc=1; d._fz=true; }
    }
    if(!ok) return false;
    score+=sc;
  }
  d._sc=score;
  return true;
}
let FUZZ = true;
function run(){
  const toks = tokens(st.q);
  const POOL = (st.exactHouse && XTRA.length) ? DATA.concat(XTRA) : DATA;
  results = POOL.filter(d=>{
    if(st.part && String(d.part)!==st.part) return false;
    if(st.gen && d.gender!==st.gen) return false;
    if(st.aMin!=null && d.age<st.aMin) return false;
    if(st.aMax!=null && d.age>st.aMax) return false;
    if(st.exactHouse!=null && !((d.house===st.exactHouse.h && d.ward===st.exactHouse.w) || (st.linked && st.linked.includes(d.ward+':'+d.sno)))) return false;
    d._fz=false; d._sc=0; return toks.length ? matches(d,toks) : true;
  });
  const hk = h=>h.toLowerCase().replace(/\d+/g,n=>n.padStart(5,'0'));
  const cmp = {sno:(a,b)=>a.ward-b.ward||a.sno-b.sno, name:(a,b)=>a.name_en.localeCompare(b.name_en),
               house:(a,b)=>a.ward-b.ward||hk(a.house).localeCompare(hk(b.house))||a.sno-b.sno,
               ageA:(a,b)=>a.age-b.age||a.sno-b.sno, ageD:(a,b)=>b.age-a.age||a.sno-b.sno}[st.sort];
  results.sort(cmp);
  if(toks.length) results.sort((a,b)=>(b._sc||0)-(a._sc||0));   // best match first (exact door / serial / name on top)
  if(st.exactHouse){ const hw=st.exactHouse.w; results.sort((a,b)=>(a.ward!==hw)-(b.ward!==hw)); }
  st.shown=PAGE; render();
}
function hl(text, kind){
  const toks=tokens(st.q); let out=esc(text); if(!toks.length) return out;
  for(const t of toks){
    if(t.raw.length<2 && !t.te) continue;
    if((t.te && kind==='te') || (!t.te && kind==='en')){
      const r=esc(t.raw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      out=out.replace(new RegExp(r, t.te?'g':'gi'), m=>`<mark>${m}</mark>`);
    }
  }
  return out;
}

function printSlips(list){
  if(!list.length) return;
  const one = list.length===1;
  $('printArea').classList.toggle('one', one);
  let ps = document.getElementById('pagesize');
  if(!ps){ ps=document.createElement('style'); ps.id='pagesize'; document.head.appendChild(ps); }
  ps.textContent = '';   // always a normal A4 page, printed at actual size
  if(list.length > 400 && !confirm(`Print ${list.length.toLocaleString()} slips (about ${Math.ceil(list.length/8)} pages)?`)) return;
  $('printArea').innerHTML = `<div class="slips">${list.map(slip).join('')}</div>`;
  const done = ()=>{ $('printArea').innerHTML=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint', done);
  // give the Telugu font a moment to apply before the print dialog opens
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>setTimeout(()=>window.print(),150));
}

function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((ok,bad)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
}
async function snapSlip(d, btn){
  const old = btn && btn.textContent; if(btn) btn.textContent='…';
  try{
    await loadH2C(); if(document.fonts) await document.fonts.ready;
    $('snap').innerHTML = slip(d);
    const canvas = await html2canvas($('snap').firstElementChild, {scale:3, backgroundColor:'#ffffff'});
    $('snap').innerHTML = '';
    const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
    const name = `voter-slip-ward${d.ward}-${d.sno}.png`;
    const file = new File([blob], name, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches){
      await navigator.share({files:[file], title:`Voter slip · Ward ${d.ward} · ${d.sno}`});
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }
  }catch(e){ if(e && e.name!=='AbortError') alert('Could not create the image: '+(e.message||e)); }
  finally{ if(btn) btn.textContent=old; }
}

  a.download=`ward${st.ward}_voters_filtered.csv`; a.click();
};
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===t));
  if(st.ward) show('voters'); else show('home');
});
$('theme').onclick=()=>{ const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; };
window.addEventListener('popstate',()=>{ readURL(); openWard(st.ward,false); });

(async function init(){
  readURL();
  try{
    const idx = await getIndex();
    $('ward').innerHTML = `<option value="">Choose a ward…</option><option value="all">All wards (${idx.wards.length}) — search everywhere</option>` +
      idx.wards.map(w=>`<option value="${w.ward}">Ward ${w.ward} · ${fmt(w.total)} voters</option>`).join('');
    const T = idx.wards.reduce((s,w)=>s+w.total,0);
    $('tiles').innerHTML = `<a class="tile all" data-ward="all" href="?ward=all"><b>All wards</b><span>${fmt(T)} voters · search everywhere</span></a>` +
      idx.wards.map(w=>`<a class="tile" data-ward="${w.ward}" href="?ward=${w.ward}"><b>Ward ${w.ward}</b><span>${fmt(w.total)} voters</span><span>Parts ${esc(partsTxt(w.parts))}</span></a>`).join('');
  }catch(e){ $('tiles').innerHTML='<div class="empty">Could not load data/wards/index.json. Serve this folder over HTTP (python3 -m http.server) or open the GitHub Pages link.</div>'; }
  openWard(st.ward,false);
})();
</script>
</body>
</html>
